name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The Caddy shape filter tests need jq and must not be skipped in CI.
      - run: jq --version
      - run: npm run lint
      - run: npm test
      - run: npm run smoke
